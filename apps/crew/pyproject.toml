[project]
name = "mobileops-agents"
version = "0.1.0"
description = "Multi-agent Google Cloud operations crew built on ADK and A2A"
requires-python = ">=3.11"
dependencies = [
  "google-adk[a2a]==2.11.0",
  "httpx>=0.27",
  "google-auth>=2.30",
  "pydantic>=2.7",
  "opentelemetry-exporter-otlp-proto-http==1.42.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
